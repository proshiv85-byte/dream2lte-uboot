# U-Boot on the Galaxy S8+ (dream2lte) reads this from /boot on USERDATA.
# Paths are relative to the root of the partition.
#
# The kernel has a built-in command line (CONFIG_CMDLINE_FORCE), so
# "append" only matters for kernels without it.

menu title dream2lte
timeout 30
default mainline

label mainline
	menu label Arch Linux ARM (mainline)
	linux /boot/Image
	fdt /boot/dtbs/exynos/exynos8895-dream2lte.dtb
	append console=tty0 loglevel=4 panic=10 pstore.compress=none clk_ignore_unused pd_ignore_unused
